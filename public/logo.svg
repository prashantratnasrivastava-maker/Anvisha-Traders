<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 800' width='800' height='800'>
  <defs>
    <linearGradient id='orangeGrad' x1='0%' y1='100%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#f44336'/>
      <stop offset='25%' stop-color='#ff5722'/>
      <stop offset='70%' stop-color='#ff7043'/>
      <stop offset='100%' stop-color='#ff9800'/>
    </linearGradient>

    <linearGradient id='orangeHighlight' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#ff8a65'/>
      <stop offset='100%' stop-color='#ff5722'/>
    </linearGradient>

    <linearGradient id='foldShadow' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#e64a19'/>
      <stop offset='100%' stop-color='#bf360c'/>
    </linearGradient>
  </defs>

  <rect width='800' height='800' rx='140' fill='#ffffff'/>

  <g id='emblem' transform='translate(0, 15)'>
    <!-- 1. DARK SLATE BASE OF A AND T -->
    <polygon points='252,435 212,435 320,195 365,195' fill='#25303f'/>
    <polygon points='365,195 408,195 450,305 408,305' fill='#25303f'/>
    <path d='M 505 295 L 565 295 L 565 435 L 505 435 Z' fill='#25303f'/>

    <!-- 2. ORANGE GLOBE -->
    <g stroke='#ff5722' stroke-width='6.5' fill='none' stroke-linecap='round'>
      <path d='M 440 235 A 68 68 0 0 1 575 235'/>
      <path d='M 438 235 L 577 235'/>
      <path d='M 448 195 A 68 40 0 0 1 567 195'/>
      <path d='M 507 167 L 507 235'/>
      <path d='M 475 174 C 490 195 490 220 475 235'/>
      <path d='M 540 174 C 525 195 525 220 540 235'/>
    </g>

    <!-- 3. DELIVERY TRUCK -->
    <g fill='#ff5722'>
      <path d='M 550 200 L 595 200 C 605 200 612 206 616 215 L 626 226 C 629 230 630 235 630 240 L 630 242 L 550 242 Z'/>
      <path d='M 598 206 L 612 206 C 614 206 616 208 617 212 L 622 222 L 598 222 Z' fill='#ffffff'/>
      <circle cx='627' cy='234' r='2' fill='#ffcc80'/>
      <circle cx='568' cy='242' r='8' fill='#25303f'/>
      <circle cx='568' cy='242' r='3.5' fill='#ffffff'/>
      <circle cx='612' cy='242' r='8' fill='#25303f'/>
      <circle cx='612' cy='242' r='3.5' fill='#ffffff'/>
    </g>

    <!-- 4. ISOMETRIC 3D SHIPPING PACKAGE / BOX -->
    <g transform='translate(365, 290)'>
      <polygon points='65,0 130,28 65,58 0,30' fill='#ffffff' stroke='#ff5722' stroke-width='9' stroke-linejoin='round'/>
      <polygon points='32,15 50,23 98,43 80,35' fill='#ff5722'/>
      <polygon points='0,30 65,58 65,135 0,105' fill='#ffffff' stroke='#ff5722' stroke-width='9' stroke-linejoin='round'/>
      <polygon points='50,51 65,58 65,85 50,78' fill='#ff5722'/>
      <polygon points='65,58 130,28 130,105 65,135' fill='#ffffff' stroke='#ff5722' stroke-width='9' stroke-linejoin='round'/>
    </g>

    <!-- 5. DYNAMIC ORANGE RIBBON, ARROW AND HORIZONTAL T BAR -->
    <g fill='url(#orangeGrad)'>
      <path d='M 215 435 C 190 370 200 290 275 200 L 250 205 L 278 152 L 315 228 L 290 225 C 235 295 230 365 252 435 Z'/>
    </g>
    <path d='M 278 152 L 275 200 L 290 225 L 315 228 Z' fill='url(#foldShadow)' opacity='0.3'/>

    <g fill='url(#orangeGrad)'>
      <path d='M 215 435 C 235 390 280 345 350 340 C 420 335 450 285 510 250 L 640 248 C 655 248 655 270 640 280 L 525 282 C 480 290 445 350 375 375 C 310 400 250 420 215 435 Z'/>
    </g>

    <path d='M 510 250 C 470 275 435 340 375 370 C 310 405 250 425 215 435 C 240 400 290 360 360 345 C 430 330 470 275 510 250 Z' fill='url(#orangeHighlight)'/>
  </g>

  <!-- TYPOGRAPHY: Anvisha -->
  <g transform='translate(400, 560)' text-anchor='middle'>
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size='92' font-weight='800' fill='#25303f' letter-spacing='-1'>
      Anvisha
    </text>
  </g>

  <!-- TYPOGRAPHY: TRADERS -->
  <g transform='translate(400, 625)' text-anchor='middle'>
    <text font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size='38' font-weight='800' fill='#25303f' letter-spacing='14'>
      TRADERS
    </text>
  </g>

  <!-- STAR AND DIVIDER -->
  <g transform='translate(400, 652)'>
    <path d='M -145 0 Q -70 -2.5 -25 -0.5 Q -70 2.5 -145 0 Z' fill='#ff5722'/>
    <polygon points='0,-14 4.5,-2 16,0 4.5,2 0,14 -4.5,2 -16,0 -4.5,-2' fill='#ff5722'/>
    <path d='M 145 0 Q 70 -2.5 25 -0.5 Q 70 2.5 145 0 Z' fill='#ff5722'/>
  </g>
</svg>